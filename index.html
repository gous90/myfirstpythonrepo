<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version v6</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee, #c2ffd8);
            font-family: Arial, sans-serif;
        }

        main {
            padding: 3rem 4rem;
            border: 1px solid rgb(255 255 255 / 70%);
            border-radius: 24px;
            background: rgb(255 255 255 / 82%);
            box-shadow: 0 20px 50px rgb(52 40 95 / 18%);
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #7147c8;
            font-size: clamp(2rem, 8vw, 4rem);
        }
    </style>
</head>
<body>
    <main>
        <h1>This is Design version v6</h1>
    </main>
</body>
</html>
